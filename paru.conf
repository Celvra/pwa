#
# $PARU_CONF
# /etc/paru.conf
# ~/.config/paru/paru.conf
#
# See the paru.conf(5) manpage for options

#
# GENERAL OPTIONS
#
[options]
PgpFetch
Devel
Provides
DevelSuffixes = -git -cvs -svn -bzr -darcs -always -hg -fossil
#AurOnly
#BottomUp
#RemoveMake
#SudoLoop
#UseAsk
#SaveChanges
#CombinedUpgrade
#CleanAfter
#UpgradeMenu
#NewsOnUpgrade

#LocalRepo
#Chroot
#Sign
#SignDb
#KeepRepoCache

#
# Binary OPTIONS
#
#[bin]
#FileManager = vifm
#MFlags = --skippgpcheck
#Sudo = doas

#
# new: AI OPTIONS
#
# Uncommenting this section enables the AI layer. Any OpenAI compatible apis are supported
# The key may also come from the PARU_AI_KEY environment variable
# Recommended to use a cheap model
#
#[ai]
#Url = https://urapi/v1
#Model = deepseek-v4-flash
#KeyFile = ~/.config/paru/ai.key
#NoEdit
# The Tavily API key enables the AI's web search tool. Without it the AI fallback to scraping public search pages. May also come from PARU_TAVILY_KEY.
#TavilyKey = xxxxxxx

# no key example
#Url = http://localhost:11434/v1
#Model = qwen3.8-21b
