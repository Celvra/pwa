name: Build Release
on:
  push:
    tags:
      - v*
    branches:
       - test-release/*

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=${ref##test-release/}" >> $GITHUB_OUTPUT
        env:
          ref: ${{ github.ref_name }}

  build-releases:
    name: Build release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
        - docker: amd64
          arch: x86_64
        - docker: arm64/v8
          arch: aarch64
        - docker: arm/v7
          arch: armv7h

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - uses: docker/setup-buildx-action@v3
        with:
          version: latest
          install: true
      - run: docker build --platform=linux/${{ matrix.platform.docker }} -o . .
      - run: mv pwa.tar.zst pwa-${{ matrix.platform.arch }}.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-${{ matrix.platform.arch }}
          path: pwa-${{ matrix.platform.arch }}.tar.zst

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-releases, get-version]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename artifacts
        run: |
          cd artifacts
          for arch in x86_64 aarch64 armv7h; do
            mv "pwa-$arch/pwa-$arch.tar.zst" "pwa-${{ needs.get-version.outputs.version }}-$arch.tar.zst"
          done
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: PWA ${{ needs.get-version.outputs.version }}
          draft: true
          prerelease: false
          files: artifacts/pwa-*.tar.zst

