name: PWA

on:
  push:
    paths:
      - 'src/*.rs'
      - 'testdata/**'
      - 'tests/**'
      - 'Cargo.*'
  pull_request:
    paths:
      - 'src/*.rs'
      - 'testdata/**'
      - 'tests/**'
      - 'Cargo.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux
    steps:
      - name: Install Packages
        run: |
          set -euo pipefail
          cat >/etc/pacman.d/mirrorlist <<'EOF'
          Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch
          Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
          Server = https://ftp.osuosl.org/pub/archlinux/$repo/os/$arch
          EOF
          if ! grep -q '^XferCommand' /etc/pacman.conf; then
            echo 'XferCommand = /usr/bin/curl -L --retry 5 --retry-delay 3 -C - -o %o %u' >> /etc/pacman.conf
          fi
          PACKAGES=(rust clang gcc git libarchive pkgconf sudo fakeroot)
          for i in 1 2 3 4 5; do
            if pacman -Syu --noconfirm --needed "${PACKAGES[@]}"; then
              break
            fi
            echo "pacman failed, retry $i/5" >&2
            sleep $((i * 5))
            if [ "$i" -eq 5 ]; then
              echo "pacman failed after retries" >&2
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt -- --check

      - name: Build
        run: cargo build --locked --features generate

      - name: Test
        run: sudo -u nobody XDG_STATE_HOME=/tmp CARGO_HOME=/tmp/cargo cargo test --locked --features generate,mock --target-dir=/tmp -- --nocapture

  test-git:
    runs-on: ubuntu-latest
    container:
      image: archlinux
    steps:
      - name: Install Packages
        run: |
          set -euo pipefail
          cat >/etc/pacman.d/mirrorlist <<'EOF'
          Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch
          Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
          Server = https://ftp.osuosl.org/pub/archlinux/$repo/os/$arch
          EOF
          if ! grep -q '^XferCommand' /etc/pacman.conf; then
            echo 'XferCommand = /usr/bin/curl -L --retry 5 --retry-delay 3 -C - -o %o %u' >> /etc/pacman.conf
          fi
          PACKAGES=(rust curl clang git base-devel libarchive meson asciidoc doxygen fakechroot pkgconf)
          for i in 1 2 3 4 5; do
            if pacman -Syu --noconfirm --needed "${PACKAGES[@]}"; then
              break
            fi
            echo "pacman failed, retry $i/5" >&2
            sleep $((i * 5))
            if [ "$i" -eq 5 ]; then
              echo "pacman failed after retries" >&2
              exit 1
            fi
          done

      - name: Install Pacman-git
        run: |
          git clone https://aur.archlinux.org/pacman-git
          chown -R nobody pacman-git
          cd pacman-git
          sudo -u nobody makepkg --nocheck
          sudo -u nobody makepkg --packagelist > list
          yes | pacman -U $(cat list)

      - name: Checkout
        uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt -- --check

      - name: Build
        run: cargo build --locked --features git,generate

      - name: Test
        run: sudo -u nobody XDG_STATE_HOME=/tmp CARGO_HOME=/tmp/cargo cargo test --locked --features git,generate,mock --target-dir=/tmp -- --nocapture
