name: PWA

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/*.rs'
      - 'testdata/**'
      - 'tests/**'
      - 'Cargo.*'
  pull_request:
    paths:
      - 'src/*.rs'
      - 'testdata/**'
      - 'tests/**'
      - 'Cargo.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux
    steps:
      - name: Install Packages
        run: pacman -Syu rust clang gcc git libarchive pkgconf sudo fakeroot --noconfirm --needed

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore testdata pkg cache
        uses: actions/cache@v4
        with:
          path: testdata/pkg
          key: testdata-pkg-archive-20210430

      - name: Pre-seed build-dep cache
        run: |
          mkdir -p testdata/pkg /tmp/pacmandb
          cp testdata/pacman.conf /tmp/pacman-seed.conf
          printf '\n[options]\nDBPath = /tmp/pacmandb\n' >> /tmp/pacman-seed.conf
          for i in 1 2 3 4 5; do
            rm -f /tmp/pacmandb/db.lck
            pacman -Sy --config /tmp/pacman-seed.conf && break
            echo "sync retry $i..."
            sleep $((i*5))
          done
          PKGS="expac jq meson gtest gmock cmake python pkgconf python-sphinx python-packaging cairo xcb-util-image xcb-util-wm xcb-util-xrm xcb-util-cursor alsa-lib libpulse libmpdclient libnl jsoncpp curl i3-wm perl git systemd ninja"
          rm -f /tmp/pacmandb/db.lck
          pacman -Sp --config /tmp/pacman-seed.conf --noconfirm $PKGS 2>/dev/null | grep -E '^https?://' | sort -u > /tmp/urls.txt || true
          echo "files to fetch: $(wc -l < /tmp/urls.txt)"
          while read -r url; do
            f="testdata/pkg/$(basename "$url")"
            [ -s "$f" ] && continue
            echo "-> $(basename "$url")"
            ok=0
            for i in 1 2 3 4 5 6 7 8; do
              if curl -fsSL --connect-timeout 15 --retry 3 --retry-delay 3 -C - -o "$f.part" "$url"; then
                mv "$f.part" "$f"
                ok=1
                break
              fi
              sleep $((i*2))
            done
            [ $ok -eq 1 ] || echo "WARNING: failed to fetch $url"
          done < /tmp/urls.txt
          echo "Pre-seed done: $(ls testdata/pkg | wc -l) packages, $(du -sh testdata/pkg | cut -f1)"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt -- --check

      - name: Build
        run: cargo build --locked --features generate

      - name: Test
        run: sudo -u nobody XDG_STATE_HOME=/tmp CARGO_HOME=/tmp/cargo cargo test --locked --features generate,mock --target-dir=/tmp -- --nocapture

  test-git:
    runs-on: ubuntu-latest
    container:
      image: archlinux
    steps:
      - name: Install Packages
        run: pacman -Syu rust curl clang git base-devel libarchive meson asciidoc doxygen fakechroot pkgconf --noconfirm --needed

      - name: Install Pacman-git
        run: |
          git clone https://aur.archlinux.org/pacman-git
          chown -R nobody pacman-git
          cd pacman-git
          sudo -u nobody makepkg --nocheck
          sudo -u nobody makepkg --packagelist > list
          yes | pacman -U $(cat list)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore testdata pkg cache
        uses: actions/cache@v4
        with:
          path: testdata/pkg
          key: testdata-pkg-archive-20210430

      - name: Pre-seed build-dep cache
        run: |
          mkdir -p testdata/pkg /tmp/pacmandb
          cp testdata/pacman.conf /tmp/pacman-seed.conf
          printf '\n[options]\nDBPath = /tmp/pacmandb\n' >> /tmp/pacman-seed.conf
          for i in 1 2 3 4 5; do
            rm -f /tmp/pacmandb/db.lck
            pacman -Sy --config /tmp/pacman-seed.conf && break
            echo "sync retry $i..."
            sleep $((i*5))
          done
          PKGS="expac jq meson gtest gmock cmake python pkgconf python-sphinx python-packaging cairo xcb-util-image xcb-util-wm xcb-util-xrm xcb-util-cursor alsa-lib libpulse libmpdclient libnl jsoncpp curl i3-wm perl git systemd ninja"
          rm -f /tmp/pacmandb/db.lck
          pacman -Sp --config /tmp/pacman-seed.conf --noconfirm $PKGS 2>/dev/null | grep -E '^https?://' | sort -u > /tmp/urls.txt || true
          echo "files to fetch: $(wc -l < /tmp/urls.txt)"
          while read -r url; do
            f="testdata/pkg/$(basename "$url")"
            [ -s "$f" ] && continue
            echo "-> $(basename "$url")"
            ok=0
            for i in 1 2 3 4 5 6 7 8; do
              if curl -fsSL --connect-timeout 15 --retry 3 --retry-delay 3 -C - -o "$f.part" "$url"; then
                mv "$f.part" "$f"
                ok=1
                break
              fi
              sleep $((i*2))
            done
            [ $ok -eq 1 ] || echo "WARNING: failed to fetch $url"
          done < /tmp/urls.txt
          echo "Pre-seed done: $(ls testdata/pkg | wc -l) packages, $(du -sh testdata/pkg | cut -f1)"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt -- --check

      - name: Build
        run: cargo build --locked --features git,generate

      - name: Test
        run: sudo -u nobody XDG_STATE_HOME=/tmp CARGO_HOME=/tmp/cargo cargo test --locked --features git,generate,mock --target-dir=/tmp -- --nocapture
